<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2D8B7B">
<title>Recibo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Base = el recibo tal como sale en el PDF */
  :root {
    /* colores del logo */
    --crema: #FFFDF2;
    --verde: #2D8B7B;
    --mostaza: #E9C354;
    --durazno: #FCA973;
    --cafe: #68390F;
    --borde: #CFE0D9;
  }
  @page { size: A4; margin: 14mm; }
  body { font-family: Roboto, Arial, sans-serif; font-size: 14px; color: #3A2410; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  input { font: inherit; color: inherit; border: 0; background: none; padding: 0; width: 100%; box-sizing: border-box; }
  .marca { font-family: 'Bricolage Grotesque', Arial, sans-serif; }
  .cab { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .cab img { width: 110px; height: 110px; }
  .cab h1 { flex: 1; margin: 0; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; color: var(--verde); }
  .meta { text-align: right; line-height: 1.3; }
  .meta .n { font-size: 26px; font-weight: 800; color: var(--cafe); }
  .meta .n input { width: 3.4em; text-align: right; }
  .meta input { width: 6.5em; text-align: right; }
  /* borde de encaje, como el del logo */
  .encaje {
    height: 11px; margin: 16px 0 28px;
    background:
      radial-gradient(circle at 50% 5px, #fff 2px, transparent 2.6px) 0 0 / 24px 11px repeat-x,
      linear-gradient(var(--verde), var(--verde)) 0 0 / 100% 5px no-repeat,
      radial-gradient(circle at 50% 0, var(--verde) 12px, transparent 12.6px) 0 0 / 24px 11px repeat-x;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 10px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: var(--verde); color: #fff; font-weight: 700; }
  #items td { border-bottom: 1px solid #B9D3CA; }
  td input { text-align: inherit; }
  .totals { width: 50%; margin: 24px 0 0 auto; }
  .totals td { padding: 6px 10px; text-align: right; }
  .totals .gran td { background: var(--mostaza); color: var(--cafe); font-size: 20px; font-weight: 800; padding: 12px 10px; }
  .gracias { margin: 48px 0 0; text-align: center; font-size: 18px; font-weight: 800; color: var(--verde); }
  .pantalla, .lbl, .menos, .mas { display: none; }

  @media screen {
    body {
      color: #4A2A0E;
      background-color: var(--crema);
      /* chispitas como las del logo */
      background-image:
        radial-gradient(circle at 20% 30%, var(--mostaza) 1.6px, transparent 2.2px),
        radial-gradient(circle at 70% 80%, var(--durazno) 1.3px, transparent 1.9px),
        radial-gradient(circle at 85% 15%, var(--verde) 0.9px, transparent 1.5px),
        radial-gradient(circle at 40% 65%, var(--mostaza) 1px, transparent 1.6px);
      background-size: 37px 41px, 53px 47px, 29px 61px, 43px 31px;
      padding: 24px 14px 140px;
    }
    .pantalla { display: block; font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    header.pantalla { max-width: 760px; margin: 0 auto 18px; }
    header h2 { font-size: clamp(30px, 8vw, 46px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; margin: 0; color: var(--verde); }
    header h2, header p { text-shadow: 0 0 6px var(--crema), 0 0 2px var(--crema); }
    header p { margin: 6px 0 0; font-size: 17px; color: var(--cafe); }

    .hoja {
      max-width: 760px; margin: 0 auto; background: #fff; padding: 28px 24px 32px;
      border-radius: 3px; box-shadow: 0 1px 0 var(--borde), 0 18px 40px -18px rgba(45, 139, 123, .4);
    }
    input { font-size: 16px; border-radius: 8px; padding: 8px 10px; background: #FFF8E1; border: 1.5px solid var(--borde); }
    input:focus { outline: none; border-color: var(--verde); background: #fff; box-shadow: 0 0 0 3px rgba(45, 139, 123, .25); }
    .meta { line-height: 2.2; }
    .meta input { width: 8em; line-height: normal; }
    .meta .n input { width: 5em; }
    .paso input { min-width: 0; }
    td { vertical-align: middle; }
    button { font-family: 'Bricolage Grotesque', system-ui, sans-serif; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
    button.del { background: none; border: 0; color: #9A3B2A; font-size: 22px; width: 44px; height: 44px; border-radius: 50%; }
    .agregar {
      display: block; width: 100%; margin-top: 14px; padding: 14px; font-size: 18px; font-weight: 500;
      color: var(--cafe); background: none; border: 2px dashed var(--borde); border-radius: 12px;
    }
    .agregar:hover { border-color: var(--verde); }

    .barra {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px;
      padding: 14px max(16px, calc((100vw - 760px) / 2)) calc(14px + env(safe-area-inset-bottom));
      background: var(--verde); color: var(--crema);
    }
    .barra .suma { flex: 1; line-height: 1.1; }
    .barra small { display: block; font-size: 15px; opacity: .8; }
    .barra b { font-size: 26px; font-weight: 800; }
    .guardar {
      font-size: 20px; font-weight: 800; padding: 16px 24px; border: 0; border-radius: 14px;
      background: var(--mostaza); color: var(--cafe);
    }
    .guardar:active { transform: scale(.97); }
  }

  /* Celular: cada producto es una ficha */
  @media screen and (max-width: 620px) {
    .hoja { padding: 22px 16px 24px; }
    .cab img { width: 84px; height: 84px; }
    .cab h1 { font-size: 24px; }
    .meta { width: 100%; text-align: left; }
    .meta input, .meta .n input { text-align: left; }
    thead { display: none; }
    #items tr {
      display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) 44px; gap: 10px; align-items: end;
      padding: 14px 0; border-bottom: 1.5px solid var(--borde);
    }
    #items td { border: 0; padding: 0; text-align: left !important; width: auto !important; }
    #items td:first-child { grid-column: 1 / -1; }
    #items td.t { grid-column: 1 / 3; font-size: 18px; font-weight: 700; color: var(--cafe); }
    #items td.del { grid-column: 3; grid-row: 2; }
    .lbl { display: block; font-size: 14px; color: var(--verde); margin-bottom: 4px; }
    .paso { display: flex; gap: 6px; }
    .menos, .mas {
      display: block; flex: none; width: 44px; height: 44px; font-size: 24px; font-weight: 800;
      border: 0; border-radius: 10px; background: #E3EFEA; color: var(--cafe);
    }
    .paso input { text-align: center; padding: 8px 2px; }
    .totals { width: 100%; margin-top: 18px; }
  }

  @media print {
    .pantalla, .del, .agregar, .lbl, .menos, .mas { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { .guardar:active { transform: none; } }
</style>
</head>
<body>
<header class="pantalla">
  <h2>Recibo nuevo</h2>
  <p>Llene la cantidad y toque Guardar PDF.</p>
</header>

<main class="hoja">
  <div class="cab">
    <img src="logo.png" alt="">
    <h1 class="marca">Arroz con encanto</h1>
    <div class="meta">
      Recibo<br><span class="n marca">N.º <input id="num" aria-label="Número de recibo"></span><br>
      Fecha <input id="fecha" aria-label="Fecha">
    </div>
  </div>
  <div class="encaje"></div>
  <table>
    <thead><tr><th>Descripción</th><th>Cantidad</th><th>Precio Unitario</th><th>Total</th><th class="del"></th></tr></thead>
    <tbody id="items"></tbody>
  </table>
  <button class="agregar pantalla" onclick="fila('', 0)">+ Agregar otro producto</button>
  <table class="totals">
    <tr><td>Subtotal</td><td id="sub"></td></tr>
    <tr class="gran marca"><td>Total</td><td id="tot"></td></tr>
  </table>
  <p class="gracias marca">¡Gracias por su compra!</p>
</main>

<div class="barra pantalla">
  <div class="suma"><small>Total</small><b id="barraTot"></b></div>
  <button class="guardar" onclick="imprimir()">Guardar PDF</button>
</div>

<script>
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = document.getElementById('num'), fecha = document.getElementById('fecha'), items = document.getElementById('items');

num.value = localStorage.getItem('siguiente') || '00035';
fecha.value = new Date().toLocaleDateString('es-CR', { day: '2-digit', month: '2-digit', year: 'numeric' });

function fila(desc = 'Arroz con leche', precio = 1000) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><span class="lbl">Producto</span><input value="${desc}" aria-label="Producto"></td>
    <td style="width:90px"><span class="lbl">Cantidad</span><div class="paso">
      <button class="menos" aria-label="Uno menos">−</button>
      <input class="c" type="number" inputmode="numeric" value="1" min="0" aria-label="Cantidad">
      <button class="mas" aria-label="Uno más">+</button></div></td>
    <td style="width:120px"><span class="lbl">Precio</span><input class="p" type="number" inputmode="numeric" value="${precio}" min="0" aria-label="Precio"></td>
    <td class="t" style="width:110px"></td>
    <td class="del"><button class="del" aria-label="Quitar producto">✕</button></td>`;
  items.append(tr);
  calc();
}

function calc() {
  let total = 0;
  for (const tr of items.rows) {
    const t = (+tr.querySelector('.c').value || 0) * (+tr.querySelector('.p').value || 0);
    tr.querySelector('.t').textContent = fmt(t);
    total += t;
  }
  document.getElementById('sub').textContent = fmt(total);
  document.getElementById('tot').textContent = document.getElementById('barraTot').textContent = '₡' + fmt(total);
}
items.addEventListener('input', calc);
items.addEventListener('click', e => {
  const tr = e.target.closest('tr'), c = tr && tr.querySelector('.c');
  if (e.target.closest('.del')) tr.remove();
  else if (e.target.closest('.mas')) c.value = (+c.value || 0) + 1;
  else if (e.target.closest('.menos')) c.value = Math.max(0, (+c.value || 0) - 1);
  else return;
  calc();
});

function imprimir() {
  document.title = 'Recibo ' + num.value; // nombre del archivo PDF
  window.print();
}
// en celulares print() no bloquea; subir el número solo cuando cierre el diálogo
addEventListener('afterprint', () => {
  num.value = String(+num.value + 1).padStart(num.value.length, '0');
  localStorage.setItem('siguiente', num.value);
});

fila();
</script>
</body>
</html>
